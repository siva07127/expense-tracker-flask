{% extends "base.html" %}
{% block title %}Update Expense - Expense Tracker{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Update Expense</h1>

    <form method="POST">
        <label>Expense Title</label>
        <input type="text" name="title" value="{{ expense.title }}" required>

        <label>Amount</label>
        <input type="number" name="amount" step="0.01" min="0" value="{{ expense.amount }}" required>

        <label>Category</label>
        <select name="category" required>
            {% for category in ["Food", "Travel", "Shopping", "Education", "Entertainment", "Health", "Bills", "Other"] %}
                <option value="{{ category }}" {% if expense.category == category %}selected{% endif %}>
                    {{ category }}
                </option>
            {% endfor %}
        </select>

        <label>Date</label>
        <input type="date"
               name="expense_date"
               value="{{ expense.expense_date.strftime('%Y-%m-%d') }}"
               required>

        <label>Description</label>
        <textarea name="description">{{ expense.description or "" }}</textarea>

        <button type="submit">Update Expense</button>
    </form>
</div>
{% endblock %}
